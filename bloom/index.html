<!doctype html>
<html lang="en" data-app="bloom" data-theme="light" data-accent="lotus">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bloom — Yoga & Gentle Movement</title>
    <meta name="description" content="Gentle yoga flows that fit your day: animated, voiced pose guides, guided breathing and kind reminders." />
    <meta name="theme-color" content="#faf6f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bloom" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/bloom/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/bloom/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/bloom/icons/apple-touch-icon.png" />
    <script>
      // Bloom lives at /bloom/ (with the slash, so the installed app's scope matches), and picks
      // its light or dusk theme before the first paint so there's no flash.
      ;(function () {
        if (location.pathname === '/bloom') location.replace('/bloom/' + location.search + location.hash)
        try {
          var root = document.documentElement
          var mode = localStorage.getItem('bloom.theme') || 'auto'
          root.dataset.theme = mode === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : mode
          var accent = localStorage.getItem('bloom.accent')
          if (accent) root.dataset.accent = accent
        } catch (e) {}
      })()
    </script>
    <!-- iPhone launch screens (made by scripts/gen-icons.mjs) -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/bloom/splash/splash-1320x2868.png" />
